name: Update Guangdong Telecom IPTV

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-gd-telecom.mjs'
      - 'scripts/lib/gd-telecom.mjs'
      - 'config/udpxy.json'
      - 'tests/build-gd-telecom.test.mjs'
      - 'package.json'
      - '.github/workflows/update-gd-telecom-iptv.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-gd-telecom.mjs'
      - 'scripts/lib/gd-telecom.mjs'
      - 'config/udpxy.json'
      - 'tests/build-gd-telecom.test.mjs'
      - 'package.json'
      - '.github/workflows/update-gd-telecom-iptv.yml'
  schedule:
    # 06:30 and 18:30 China Standard Time (UTC+8)
    - cron: '30 22 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    # Supports recovery runs after workflow or upstream changes.
    # Generator, download, and validation steps were verified by PR run 7.

permissions:
  contents: write

concurrency:
  group: update-gd-telecom-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: agent/refresh-gd-iptv-data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run generator tests
        run: node --test tests/build-gd-telecom.test.mjs

      - name: Download upstream playlists and EPG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/gd-telecom
          base='https://raw.githubusercontent.com/Tzwcard/ChinaTelecom-GuangdongIPTV-RTP-List/master'
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/gd-telecom/all.m3u "$base/GuangdongIPTV_rtp_all.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/gd-telecom/hd.m3u "$base/GuangdongIPTV_rtp_hd.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/gd-telecom/sd.m3u "$base/GuangdongIPTV_rtp_sd.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/gd-telecom/4k.m3u "$base/GuangdongIPTV_rtp_4k.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/gd-telecom/epg.xml "$base/epg.xml"
          upstream_sha="$(git ls-remote https://github.com/Tzwcard/ChinaTelecom-GuangdongIPTV-RTP-List.git refs/heads/master | cut -f1)"
          test -n "$upstream_sha"
          printf '%s' "$upstream_sha" > .tmp/gd-telecom/upstream-sha.txt

      - name: Generate classified udpxy playlist
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-gd-telecom.mjs \
            --all .tmp/gd-telecom/all.m3u \
            --hd .tmp/gd-telecom/hd.m3u \
            --sd .tmp/gd-telecom/sd.m3u \
            --4k .tmp/gd-telecom/4k.m3u \
            --epg .tmp/gd-telecom/epg.xml \
            --config config/udpxy.json \
            --output-dir m3u \
            --upstream-sha "$(cat .tmp/gd-telecom/upstream-sha.txt)"

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s m3u/gd-telecom.m3u
          test -s m3u/gd-telecom-report.json
          test -s m3u/gd-telecom-epg.xml
          ! grep -Eqi 'CAVS|时移|rtp://' m3u/gd-telecom.m3u
          endpoint="$(node -e "const c=require('./config/udpxy.json'); process.stdout.write(c.protocol+'://'+c.host+':'+c.port+'/udp/')")"
          grep -Fq "$endpoint" m3u/gd-telecom.m3u
          node - <<'NODE'
          const report = require('./m3u/gd-telecom-report.json');
          if (report.selectedChannels < 50) throw new Error('Too few selected channels');
          if (report.inputs.fourK.entries < 1) throw new Error('4K evidence list is empty');
          if (report.inputs.hd.entries < 1) throw new Error('HD evidence list is empty');
          console.log(JSON.stringify({
            upstreamSha: report.upstreamSha,
            selectedChannels: report.selectedChannels,
            groups: report.groups,
            qualityEvidence: report.qualityEvidence,
          }, null, 2));
          NODE

      - name: Publish generated data to refresh branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/refresh-gd-iptv-data
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.TARGET_BRANCH;
          const token = process.env.GITHUB_TOKEN;
          const paths = ['m3u/gd-telecom.m3u', 'm3u/gd-telecom-report.json'];

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.headers || {}),
              },
            });
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${url} failed: ${response.status} ${await response.text()}`);
            }
            return response.status === 204 ? null : response.json();
          }

          for (const path of paths) {
            const encodedPath = path.split('/').map(encodeURIComponent).join('/');
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodedPath}`;
            const current = await request(`${url}?ref=${encodeURIComponent(branch)}`);
            const local = fs.readFileSync(path);
            const remote = Buffer.from(String(current.content || '').replace(/\n/g, ''), 'base64');
            if (local.equals(remote)) {
              console.log(`${path}: unchanged`);
              continue;
            }
            await request(url, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: `data: refresh ${path.split('/').at(-1)}`,
                content: local.toString('base64'),
                sha: current.sha,
                branch,
              }),
            });
            console.log(`${path}: updated`);
          }
          NODE
