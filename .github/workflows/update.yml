name: Update Guangdong IPTV

on:
  push:
    branches: [main, 'feature/unicom-merged-multisource-4k']
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-guangdong-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Download upstream data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp

          telecom='https://raw.githubusercontent.com/Tzwcard/ChinaTelecom-GuangdongIPTV-RTP-List/master'
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/all.m3u "$telecom/GuangdongIPTV_rtp_all.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/hd.m3u "$telecom/GuangdongIPTV_rtp_hd.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/4k.m3u "$telecom/GuangdongIPTV_rtp_4k.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/probe.txt "$telecom/GuangdongIPTV_rtp_probe.txt"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/epg.xml "$telecom/epg.xml"
          git ls-remote https://github.com/Tzwcard/ChinaTelecom-GuangdongIPTV-RTP-List.git refs/heads/master | cut -f1 > .tmp/telecom-upstream-sha

          unicom='https://raw.githubusercontent.com/xisohi/CHINA-IPTV/main/Unicast/guangdong/unicom.txt'
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/gd-unicom.txt "$unicom"
          git ls-remote https://github.com/xisohi/CHINA-IPTV.git refs/heads/main | cut -f1 > .tmp/unicom-upstream-sha

          unicom_secondary='https://raw.githubusercontent.com/lu791758-hub/GDIPTV/main/tv.m3u'
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/gd-unicom-secondary.m3u "$unicom_secondary"
          git ls-remote https://github.com/lu791758-hub/GDIPTV.git refs/heads/main | cut -f1 > .tmp/unicom-secondary-sha

          test -s .tmp/all.m3u
          test -s .tmp/probe.txt
          test -s .tmp/telecom-upstream-sha
          test -s .tmp/gd-unicom.txt
          test -s .tmp/unicom-upstream-sha
          test -s .tmp/gd-unicom-secondary.m3u
          test -s .tmp/unicom-secondary-sha

      - name: Generate playlists
        run: |
          node scripts/generate.mjs \
            --all .tmp/all.m3u \
            --hd .tmp/hd.m3u \
            --4k .tmp/4k.m3u \
            --probe .tmp/probe.txt \
            --epg .tmp/epg.xml \
            --config config/udpxy.json \
            --output m3u \
            --upstream-sha "$(cat .tmp/telecom-upstream-sha)"

          node scripts/generate-unicom.mjs \
            --input .tmp/gd-unicom.txt \
            --input-secondary .tmp/gd-unicom-secondary.m3u \
            --output m3u \
            --upstream-sha "$(cat .tmp/unicom-upstream-sha)" \
            --secondary-sha "$(cat .tmp/unicom-secondary-sha)"

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -s m3u/gd-telecom.m3u
          test -s m3u/gd-telecom-udpxy.m3u
          test -s m3u/gd-telecom-4k.m3u
          test -s m3u/gd-telecom-report.json
          test -s m3u/gd-telecom-epg.xml

          grep -q '^rtp://' m3u/gd-telecom.m3u
          ! grep -Eqi 'CAVS|时移|回看|192\.168\.5\.7:4022/udp/' m3u/gd-telecom.m3u

          grep -q '^http://192\.168\.5\.7:4022/udp/' m3u/gd-telecom-udpxy.m3u
          ! grep -Eqi 'CAVS|时移|回看|^rtp://' m3u/gd-telecom-udpxy.m3u

          grep -q '^#EXTINF:' m3u/gd-telecom-4k.m3u
          grep -q '^rtp://' m3u/gd-telecom-4k.m3u
          ! grep -Eqi 'CAVS|时移|回看|192\.168\.5\.7:4022/udp/' m3u/gd-telecom-4k.m3u

          test -s m3u/gd-unicom.m3u
          test -s m3u/gd-unicom-simple.m3u
          test -s m3u/gd-unicom-report.json
          grep -q '^#EXTINF:' m3u/gd-unicom.m3u
          grep -q 'group-title="4K超高清"' m3u/gd-unicom.m3u
          grep -q '120\.87\.19\.109' m3u/gd-unicom.m3u
          ! grep -Eqi 'rtp://|udp://|sttv-hls|192\.168\.5\.6|kwimgs\.com|iesdouyin\.com' m3u/gd-unicom.m3u

          node - <<'NODE'
          const fs = require('node:fs');
          const telecom = require('./m3u/gd-telecom-report.json');
          if (telecom.schemaVersion !== 3) throw new Error('Unexpected Telecom report schema');
          if (telecom.selectedChannels < 50) throw new Error('Too few Telecom channels');
          if (telecom.selectedLines <= telecom.selectedChannels) throw new Error('No alternate Telecom RTP lines generated');
          if (telecom.multiLineChannels < 1) throw new Error('No multi-line Telecom channels generated');
          if (telecom.ultraHdSelectedLines < 1) throw new Error('No Telecom ultra-HD lines generated');
          if (telecom.inputs.all.entries < 100) throw new Error('Telecom upstream playlist is incomplete');
          if (!telecom.inputs.probe || telecom.inputs.probe.bytes < 1) throw new Error('Telecom probe data missing');
          if (!Array.isArray(telecom.inputs.probe.blockedVideoCodecs)) throw new Error('Probe blocked codec list missing');

          const blockedCodecs = new Set(['avs2', 'cavs']);
          const probe = fs.readFileSync('./.tmp/probe.txt', 'utf8');
          const blockedAddresses = [];
          for (const raw of probe.split(/\r?\n/)) {
            const codec = raw.match(/\bV:\s*([a-z0-9.]+)/i)?.[1]?.toLowerCase();
            if (!codec || !blockedCodecs.has(codec)) continue;
            const address = raw.match(/^\s*((?:\d{1,3}\.){3}\d{1,3}:\d{1,5})\b/)?.[1];
            if (address) blockedAddresses.push(address);
          }
          const telecomOutputs = [
            fs.readFileSync('./m3u/gd-telecom.m3u', 'utf8'),
            fs.readFileSync('./m3u/gd-telecom-udpxy.m3u', 'utf8'),
            fs.readFileSync('./m3u/gd-telecom-4k.m3u', 'utf8'),
          ].join('\n');
          for (const address of blockedAddresses) {
            if (telecomOutputs.includes(address)) throw new Error(`Probe-blocked video line leaked into output: ${address}`);
          }

          const unicom = require('./m3u/gd-unicom-report.json');
          if (unicom.schemaVersion !== 3) throw new Error('Unexpected Unicom report schema');
          if (!Array.isArray(unicom.upstreams) || unicom.upstreams.length !== 2) throw new Error('Unicom upstream merge is incomplete');
          if (unicom.selectedChannels < 20) throw new Error('Too few Unicom channels');
          if (unicom.selectedLines < unicom.selectedChannels) throw new Error('Invalid Unicom line counts');
          if (unicom.fourKChannels < 1 || unicom.fourKLines < 1) throw new Error('No Unicom 4K channels generated');
          if (unicom.primaryPlaylistMode !== 'merged-all-lines-plus-4k-group') throw new Error('Unexpected Unicom primary mode');
          if (unicom.simplePlaylistMode !== 'best-line-per-channel-plus-4k-group') throw new Error('Unexpected Unicom simple mode');

          function validateUnicomUrls(filename) {
            const text = fs.readFileSync(filename, 'utf8');
            for (const raw of text.split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith('#')) continue;
              const url = new URL(line);
              const hostOk = /^120\.87\.\d{1,3}\.\d{1,3}$/.test(url.hostname) || url.hostname === '112.89.121.23';
              const pathOk = url.pathname.includes('/PLTV/88888973/224/') && /\.m3u8$/i.test(url.pathname);
              if (!hostOk || !pathOk) throw new Error(`Non-Unicom IPTV URL leaked into ${filename}: ${line}`);
            }
          }
          validateUnicomUrls('./m3u/gd-unicom.m3u');
          validateUnicomUrls('./m3u/gd-unicom-simple.m3u');

          const primary = fs.readFileSync('./m3u/gd-unicom.m3u', 'utf8');
          const simple = fs.readFileSync('./m3u/gd-unicom-simple.m3u', 'utf8');
          const primaryCctv13 = (primary.match(/,CCTV13\n/g) || []).length;
          const simpleCctv13 = (simple.match(/,CCTV13\n/g) || []).length;
          if (primaryCctv13 < 2) throw new Error('CCTV13 alternates missing from APTV playlist');
          if (simpleCctv13 !== 1) throw new Error('CCTV13 simple playlist should contain one regular entry');

          console.log(JSON.stringify({ telecom, blockedProbeEntries: blockedAddresses.length, unicom, primaryCctv13, simpleCctv13 }, null, 2));
          NODE

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            m3u/gd-telecom.m3u
            m3u/gd-telecom-udpxy.m3u
            m3u/gd-telecom-4k.m3u
            m3u/gd-telecom-epg.xml
            m3u/gd-telecom-report.json
            m3u/gd-unicom.m3u
            m3u/gd-unicom-simple.m3u
            m3u/gd-unicom-report.json
          )
          if [[ -z "$(git status --porcelain -- "${files[@]}")" ]]; then
            echo 'No data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'data: refresh Guangdong IPTV playlists'
          git push
