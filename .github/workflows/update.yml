name: Update Guangdong IPTV

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-guangdong-iptv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Download upstream data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp

          telecom='https://raw.githubusercontent.com/Tzwcard/ChinaTelecom-GuangdongIPTV-RTP-List/master'
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/all.m3u "$telecom/GuangdongIPTV_rtp_all.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/hd.m3u "$telecom/GuangdongIPTV_rtp_hd.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/4k.m3u "$telecom/GuangdongIPTV_rtp_4k.m3u"
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/epg.xml "$telecom/epg.xml"
          git ls-remote https://github.com/Tzwcard/ChinaTelecom-GuangdongIPTV-RTP-List.git refs/heads/master | cut -f1 > .tmp/telecom-upstream-sha

          unicom='https://raw.githubusercontent.com/xisohi/CHINA-IPTV/main/Unicast/guangdong/unicom.txt'
          curl --fail --location --retry 3 --connect-timeout 20 -o .tmp/gd-unicom.txt "$unicom"
          git ls-remote https://github.com/xisohi/CHINA-IPTV.git refs/heads/main | cut -f1 > .tmp/unicom-upstream-sha

          test -s .tmp/all.m3u
          test -s .tmp/telecom-upstream-sha
          test -s .tmp/gd-unicom.txt
          test -s .tmp/unicom-upstream-sha

      - name: Generate playlists
        run: |
          node scripts/generate.mjs \
            --all .tmp/all.m3u \
            --hd .tmp/hd.m3u \
            --4k .tmp/4k.m3u \
            --epg .tmp/epg.xml \
            --config config/udpxy.json \
            --output m3u \
            --upstream-sha "$(cat .tmp/telecom-upstream-sha)"

          node scripts/generate-unicom.mjs \
            --input .tmp/gd-unicom.txt \
            --output m3u \
            --upstream-sha "$(cat .tmp/unicom-upstream-sha)"

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -s m3u/gd-telecom.m3u
          test -s m3u/gd-telecom-udpxy.m3u
          test -s m3u/gd-telecom-4k.m3u
          test -s m3u/gd-telecom-report.json
          test -s m3u/gd-telecom-epg.xml

          grep -q '^rtp://' m3u/gd-telecom.m3u
          ! grep -Eqi 'CAVS|时移|回看|192\.168\.5\.7:4022/udp/' m3u/gd-telecom.m3u

          grep -q '^http://192\.168\.5\.7:4022/udp/' m3u/gd-telecom-udpxy.m3u
          ! grep -Eqi 'CAVS|时移|回看|^rtp://' m3u/gd-telecom-udpxy.m3u

          grep -q '^#EXTINF:' m3u/gd-telecom-4k.m3u
          grep -q '^rtp://' m3u/gd-telecom-4k.m3u
          ! grep -Eqi 'CAVS|时移|回看|192\.168\.5\.7:4022/udp/' m3u/gd-telecom-4k.m3u

          test -s m3u/gd-unicom.m3u
          test -s m3u/gd-unicom-simple.m3u
          test -s m3u/gd-unicom-report.json
          grep -q '^#EXTINF:' m3u/gd-unicom.m3u
          grep -q '120\.87\.19\.109' m3u/gd-unicom.m3u
          ! grep -Eqi 'rtp://|udp://' m3u/gd-unicom.m3u

          node - <<'NODE'
          const fs = require('node:fs');
          const telecom = require('./m3u/gd-telecom-report.json');
          if (telecom.schemaVersion !== 3) throw new Error('Unexpected Telecom report schema');
          if (telecom.selectedChannels < 50) throw new Error('Too few Telecom channels');
          if (telecom.selectedLines <= telecom.selectedChannels) throw new Error('No alternate Telecom RTP lines generated');
          if (telecom.multiLineChannels < 1) throw new Error('No multi-line Telecom channels generated');
          if (telecom.ultraHdSelectedLines < 1) throw new Error('No Telecom ultra-HD lines generated');
          if (telecom.inputs.all.entries < 100) throw new Error('Telecom upstream playlist is incomplete');

          const unicom = require('./m3u/gd-unicom-report.json');
          if (unicom.schemaVersion !== 2) throw new Error('Unexpected Unicom report schema');
          if (unicom.selectedChannels < 20) throw new Error('Too few Unicom channels');
          if (unicom.upstreamEntries < unicom.selectedChannels) throw new Error('Invalid Unicom entry counts');
          if (unicom.primaryPlaylistMode !== 'all-lines-for-aptv') throw new Error('Unexpected Unicom primary mode');

          const primary = fs.readFileSync('./m3u/gd-unicom.m3u', 'utf8');
          const simple = fs.readFileSync('./m3u/gd-unicom-simple.m3u', 'utf8');
          const primaryCctv13 = (primary.match(/,CCTV13\n/g) || []).length;
          const simpleCctv13 = (simple.match(/,CCTV13\n/g) || []).length;
          if (primaryCctv13 < 2) throw new Error('CCTV13 alternates missing from APTV playlist');
          if (simpleCctv13 !== 1) throw new Error('CCTV13 simple playlist should contain one line');

          console.log(JSON.stringify({ telecom, unicom, primaryCctv13, simpleCctv13 }, null, 2));
          NODE

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            m3u/gd-telecom.m3u
            m3u/gd-telecom-udpxy.m3u
            m3u/gd-telecom-4k.m3u
            m3u/gd-telecom-epg.xml
            m3u/gd-telecom-report.json
            m3u/gd-unicom.m3u
            m3u/gd-unicom-simple.m3u
            m3u/gd-unicom-report.json
          )
          if [[ -z "$(git status --porcelain -- "${files[@]}")" ]]; then
            echo 'No data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'data: refresh Guangdong IPTV playlists'
          git push
